spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

# Orchestrierung & Observability / Aufgabe 1: Monitoring & Applikationsmetriken (Prometheus)
# Actuator-Endpunkte für Kubernetes-Gesundheitschecks und den Prometheus-Scrape freigeben.
management.endpoints.web.exposure.include=health,prometheus
# Histogramm-Buckets für http.server.requests erzeugen, damit Grafana
# Response-Time-Quantile (p50/p95/p99) berechnen kann.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Gemeinsamer Tag, um die Metriken des Dienstes in PromQL eindeutig zuordnen zu können.
management.metrics.tags.application=user_mgmt_service

# Aufgabe 6: REST-Client zum module_service (Kubernetes-Service im selben Namespace).
# MODULE_SERVICE_URL kommt aus der ConfigMap app-config (vsc-ops).
module-service.url=${MODULE_SERVICE_URL:http://module-service:8080}
# Timeouts in Millisekunden (Verbindungsaufbau / Antwort)
module-service.connect-timeout-ms=2000
module-service.read-timeout-ms=2000
