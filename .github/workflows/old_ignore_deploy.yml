name: Deploy

# Trigger: run automatically on every push to main (acceptance criterion #2).
on:
  push:
    branches: [main]

# Avoid two deploys racing each other if pushes land close together.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/0x800f081f/user_mgmt_service-backend
  FRONTEND_IMAGE: ghcr.io/0x800f081f/user_mgmt_service-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Needed to push images to GitHub Container Registry (GHCR).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src-ui
          file: ./src-ui/Dockerfile
          push: true
          # NEXT_PUBLIC_API_URL is inlined into the client bundle at build
          # time by Next.js, so it must be supplied here as a build-arg.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Needed so the deploy step can hand the server a token that is allowed
    # to pull the images just pushed above.
    permissions:
      packages: read
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        # These become the shell env vars available inside `script:` below,
        # via the `envs:` list. Each value comes from a GitHub Secret — never
        # from the repo — so nothing secret is ever written to git.
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: ${{ secrets.SPRING_JPA_HIBERNATE_DDL_AUTO }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MILLIS: ${{ secrets.JWT_EXPIRATION_MILLIS }}
          TRAEFIK_EMAIL: ${{ secrets.TRAEFIK_EMAIL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # GHCR login on the server: GITHUB_TOKEN is scoped to this repo
          # and only needs read access here, since the images were already
          # pushed by the build-and-push job above.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # t3.small + an on-server Gradle build can take a while — give it
          # more room than the action's 10m default before giving up.
          command_timeout: 20m
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,SPRING_JPA_HIBERNATE_DDL_AUTO,JWT_ISSUER,JWT_SECRET,JWT_EXPIRATION_MILLIS,TRAEFIK_EMAIL,NEXT_PUBLIC_API_URL,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/user_mgmt_service

            # Pull the latest fixed docker-compose.yml / source before rebuilding.
            git pull origin main

            # Regenerate .env from the secrets passed in above. This file never
            # lives in git — it's recreated fresh on the server on every deploy.
            cat > .env <<ENVEOF
            SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            SPRING_JPA_HIBERNATE_DDL_AUTO=$SPRING_JPA_HIBERNATE_DDL_AUTO
            JWT_ISSUER=$JWT_ISSUER
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRATION_MILLIS=$JWT_EXPIRATION_MILLIS
            TRAEFIK_EMAIL=$TRAEFIK_EMAIL
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            ENVEOF
            chmod 600 .env

            # Log in to GHCR so `docker compose pull` can fetch the images
            # that build-and-push just published (needed as long as the
            # packages are private; harmless no-op once/if they're public).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull the images built in CI instead of building on the server,
            # then (re)start the stack with the new images + config.
            docker compose pull
            docker compose up -d

            # Drop any dangling images left over from the previous deploy so
            # the small root disk doesn't fill up over time.
            docker image prune -f