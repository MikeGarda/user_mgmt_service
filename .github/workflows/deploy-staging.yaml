name: Deploy Staging (GitOps)

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ENVIRONMENT:    staging
  BACKEND_IMAGE:  ghcr.io/mikegarda/user_mgmt_service-backend
  FRONTEND_IMAGE: ghcr.io/mikegarda/user_mgmt_service-frontend
  MODULE_SERVICE_IMAGE: ghcr.io/mikegarda/user_mgmt_service-module_service
  OPS_REPO:       MikeGarda/vsc-ops
  OPS_BRANCH:     main
  VALUES_PATH:    helm/values-staging.yaml

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Kurzer Commit-Hash als Image-Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./src-ui
          file: ./src-ui/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8080
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Build & Push Module Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./module_service/Dockerfile
          push: true
          tags: ${{ env.MODULE_SERVICE_IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Promotion - neuen Tag ins Ops-Repo committen
        env:
          GH_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -e
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          git clone --depth 1 --branch "${OPS_BRANCH}" "https://x-access-token:${GH_TOKEN}@github.com/${OPS_REPO}.git" ops
          cd ops
          yq -i ".images.backend.tag  = \"${TAG}\"" "${VALUES_PATH}"
          yq -i ".images.frontend.tag = \"${TAG}\"" "${VALUES_PATH}"
          yq -i ".images.module-service.tag = \"${TAG}\"" "${VALUES_PATH}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_PATH}"
          git commit -m "promote(${ENVIRONMENT}): images -> ${TAG}" || echo "keine Aenderung"
          git push